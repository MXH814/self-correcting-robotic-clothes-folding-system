<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280" font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1600" height="1280" rx="0" fill="#f4f7f9" stroke="#f4f7f9" stroke-width="2" /><text x="48" y="58" font-size="28" font-weight="700" fill="#20364b">GROUP 3 / CLOTHES FOLDING</text><text x="48" y="101" font-size="25" font-weight="400" fill="#536a7c">Interface requirements mockup · illustrative data · no robot connected</text><rect x="1045" y="16" width="510" height="118" rx="10" fill="#e8edf1" stroke="#aebfcd" stroke-width="2" /><text x="1064" y="48" font-size="23" font-weight="700" fill="#536a7c">DEMO ONLY · session role preview</text><g class="button" role="button" tabindex="0" data-action="demo-role" aria-label="Household" aria-disabled="false" opacity="1"><rect x="1064" y="61" width="205" height="58" rx="9" fill="white" stroke="#aebfcd" stroke-width="2" /><text x="1084" y="99" font-size="26" font-weight="600" fill="#28648b">Household</text></g><g class="button" role="button" tabindex="0" data-action="demo-role" aria-label="Maintainer" aria-disabled="false" opacity="1"><rect x="1285" y="61" width="250" height="58" rx="9" fill="white" stroke="#aebfcd" stroke-width="2" /><text x="1305" y="99" font-size="26" font-weight="600" fill="#28648b">Maintainer</text></g><g class="button" role="button" tabindex="0" data-action="nav" aria-label="1 Prepare" aria-disabled="false" opacity="1"><rect x="48" y="154" width="286" height="58" rx="9" fill="white" stroke="#aebfcd" stroke-width="2" /><text x="68" y="192" font-size="26" font-weight="600" fill="#28648b">1 Prepare</text></g><g class="button" role="button" tabindex="0" data-action="nav" aria-label="2 Monitor" aria-disabled="false" opacity="1"><rect x="353" y="154" width="286" height="58" rx="9" fill="white" stroke="#aebfcd" stroke-width="2" /><text x="373" y="192" font-size="26" font-weight="600" fill="#28648b">2 Monitor</text></g><g class="button" role="button" tabindex="0" data-action="nav" aria-label="3 Assistance" aria-disabled="false" opacity="1"><rect x="658" y="154" width="286" height="58" rx="9" fill="#28648b" stroke="#28648b" stroke-width="2" /><text x="678" y="192" font-size="26" font-weight="600" fill="white">3 Assistance</text></g><g class="button" role="button" tabindex="0" data-action="nav" aria-label="4 Results" aria-disabled="false" opacity="1"><rect x="963" y="154" width="286" height="58" rx="9" fill="white" stroke="#aebfcd" stroke-width="2" /><text x="983" y="192" font-size="26" font-weight="600" fill="#28648b">4 Results</text></g><g class="button" role="button" tabindex="0" data-action="nav" aria-label="5 Maintain" aria-disabled="true" opacity=".42"><rect x="1268" y="154" width="286" height="58" rx="9" fill="white" stroke="#aebfcd" stroke-width="2" /><text x="1288" y="192" font-size="26" font-weight="600" fill="#28648b">5 Maintain</text></g><text x="48" y="266" font-size="38" font-weight="700" fill="#20364b">S03 Provide assistance</text><text x="48" y="310" font-size="25" font-weight="400" fill="#536a7c">UC05-UC06 · product actions: Take control, Adjust, Return, Terminate</text><rect x="48" y="345" width="1504" height="120" rx="14" fill="#eaf2f7" stroke="#cedbe4" stroke-width="2" /><text x="78" y="391" font-size="32" font-weight="700" fill="#20364b">Waiting for help · confirming stop</text><text x="78" y="437" font-size="26" font-weight="500" fill="#20364b">Stop status: stopping. Manual actions stay locked until the adapter confirms rest.</text><g class="button" role="button" tabindex="0" data-action="terminate" aria-label="Terminate" aria-disabled="false" opacity="1"><rect x="1260" y="365" width="250" height="58" rx="9" fill="white" stroke="#aebfcd" stroke-width="2" /><text x="1280" y="403" font-size="26" font-weight="600" fill="#28648b">Terminate</text></g><rect x="48" y="488" width="723" height="510" rx="14" fill="white" stroke="#cedbe4" stroke-width="2" /><rect x="793" y="488" width="759" height="510" rx="14" fill="white" stroke="#cedbe4" stroke-width="2" /><text x="78" y="538" font-size="29" font-weight="700" fill="#20364b">1 Wait, then take control</text><text x="78" y="588" font-size="26" font-weight="400" fill="#20364b">Request accepted is not a confirmed stop.</text><text x="78" y="630" font-size="26" font-weight="400" fill="#20364b">Motion during stopping still counts toward</text><text x="78" y="672" font-size="26" font-weight="400" fill="#20364b">the 300-second active budget.</text><g class="button" role="button" tabindex="0" data-action="take" aria-label="Take control" aria-disabled="true" opacity=".42"><rect x="78" y="755" width="610" height="58" rx="9" fill="#28648b" stroke="#28648b" stroke-width="2" /><text x="98" y="793" font-size="26" font-weight="600" fill="white">Take control</text></g><text x="78" y="870" font-size="25" font-weight="400" fill="#20364b">If confirmation times out: show stop unresolved.</text><text x="78" y="912" font-size="25" font-weight="400" fill="#20364b">No adjustment, new task or model change.</text><text x="823" y="538" font-size="29" font-weight="700" fill="#20364b">2 Adjust, then return control</text><text x="823" y="588" font-size="26" font-weight="400" fill="#20364b">Only after confirmed stop and your takeover:</text><text x="823" y="630" font-size="26" font-weight="400" fill="#20364b">reposition the supported garment or contact.</text><text x="823" y="672" font-size="26" font-weight="400" fill="#20364b">A new check is required before folding resumes.</text><g class="button" role="button" tabindex="0" data-action="adjust" aria-label="Adjust garment / gripper contact" aria-disabled="true" opacity=".42"><rect x="823" y="755" width="645" height="58" rx="9" fill="white" stroke="#aebfcd" stroke-width="2" /><text x="843" y="793" font-size="26" font-weight="600" fill="#28648b">Adjust garment / gripper contact</text></g><g class="button" role="button" tabindex="0" data-action="return" aria-label="Return control and check readiness" aria-disabled="true" opacity=".42"><rect x="823" y="835" width="645" height="58" rx="9" fill="#28648b" stroke="#28648b" stroke-width="2" /><text x="843" y="873" font-size="26" font-weight="600" fill="white">Return control and check readiness</text></g><text x="823" y="952" font-size="25" font-weight="500" fill="#536a7c">Attempts used: 3 of 3 | Remaining: 0</text><rect x="48" y="1050" width="1504" height="155" rx="10" fill="#e7edf2" stroke="#a8b9c6" stroke-width="2" /><text x="72" y="1085" font-size="24" font-weight="700" fill="#536a7c">DEMO ONLY · illustrative events, outside product permissions and workflow</text><g class="button" role="button" tabindex="0" data-action="demo" aria-label="Adapter confirms stop" aria-disabled="false" opacity="1"><rect x="72" y="1110" width="330" height="58" rx="9" fill="white" stroke="#aebfcd" stroke-width="2" /><text x="92" y="1148" font-size="26" font-weight="600" fill="#28648b">Adapter confirms stop</text></g><g class="button" role="button" tabindex="0" data-action="demo" aria-label="Adapter stop timeout" aria-disabled="false" opacity="1"><rect x="422" y="1110" width="330" height="58" rx="9" fill="white" stroke="#aebfcd" stroke-width="2" /><text x="442" y="1148" font-size="26" font-weight="600" fill="#28648b">Adapter stop timeout</text></g><g class="button" role="button" tabindex="0" data-action="demo" aria-label="Return check fails" aria-disabled="false" opacity="1"><rect x="772" y="1110" width="365" height="58" rx="9" fill="white" stroke="#aebfcd" stroke-width="2" /><text x="792" y="1148" font-size="26" font-weight="600" fill="#28648b">Return check fails</text></g><g class="button" role="button" tabindex="0" data-action="demo" aria-label="Return check passes" aria-disabled="false" opacity="1"><rect x="1157" y="1110" width="350" height="58" rx="9" fill="white" stroke="#aebfcd" stroke-width="2" /><text x="1177" y="1148" font-size="26" font-weight="600" fill="#28648b">Return check passes</text></g><text x="48" y="1250" font-size="24" font-weight="400" fill="#536a7c">Proposed MVP defaults: 3 accepted recovery attempts; 300 active simulated seconds.</text><text font-size="23" font-weight="400" x="78" y="965" fill="#4f687a">GPU cost USD 0.17 / 0.25; waiting is billed.</text><text font-size="22" font-weight="400" x="823" y="718" fill="#4f687a">Recovery limit reached; keep clothing inside the table.</text></svg>