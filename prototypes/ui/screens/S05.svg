strative IDs</text><text x="78" y="717" font-size="26" font-weight="400" fill="#20364b">Training: train-v1 · fit weights</text><text x="78" y="760" font-size="26" font-weight="400" fill="#20364b">Validation: val-v1 · tune and select</text><text x="78" y="803" font-size="26" font-weight="400" fill="#20364b">Final test: test-v1 · sealed until model freeze</text><g class="button" role="button" tabindex="0" data-action="collect" aria-label="Collect demonstrations" aria-disabled="false" opacity="1"><rect x="78" y="850" width="340" height="58" rx="9" fill="white" stroke="#aebfcd" stroke-width="2" /><text x="98" y="888" font-size="26" font-weight="600" fill="#28648b">Collect demonstrations</text></g><g class="button" role="button" tabindex="0" data-action="train" aria-label="Train candidate" aria-disabled="false" opacity="1"><rect x="438" y="850" width="345" height="58" rx="9" fill="white" stroke="#aebfcd" stroke-width="2" /><text x="458" y="888" font-size="26" font-weight="600" fill="#28648b">Train candidate</text></g><g class="button" role="button" tabindex="-1" data-action="validate" aria-label="Validate candidate" aria-disabled="true" opacity="0.42"><rect x="78" y="925" width="340" height="58" rx="9" fill="white" stroke="#aebfcd" stroke-width="2" /><text x="98" y="963" font-size="26" font-weight="600" fill="#28648b">Validate candidate</text></g><g class="button" role="button" tabindex="0" data-action="test" aria-label="Run sealed final test" aria-disabled="true" opacity=".42"><rect x="438" y="925" width="345" height="58" rx="9" fill="white" stroke="#aebfcd" stroke-width="2" /><text x="458" y="963" font-size="26" font-weight="600" fill="#28648b">Run sealed final test</text></g><text x="900" y="516" font-size="29" font-weight="700" fill="#20364b">Model and configuration</text><text x="900" y="567" font-size="24" font-weight="500" fill="#536a7c">Version and registry</text><text x="900" y="606" font-size="29" font-weight="600" fill="#20364b">baseline-v0.1 · approved registry entry</text><text x="900" y="650" font-size="24" font-weight="400" fill="#20364b">Source: approved registry / checksum</text><text x="900" y="686" font-size="24" font-weight="400" fill="#20364b">Evidence: compatible schema + acceptance</text><text x="900" y="722" font-size="24" font-weight="400" fill="#20364b">Each task keeps its frozen version.</text><g class="button" role="button" tabindex="0" data-action="activate" aria-label="Activate accepted candidate" aria-disabled="true" opacity=".42"><rect x="900" y="750" width="595" height="58" rx="9" fill="#28648b" stroke="#28648b" stroke-width="2" /><text x="920" y="788" font-size="26" font-weight="600" fill="white">Activate accepted candidate</text></g><g class="button" role="button" tabindex="0" data-action="config" aria-label="Edit configuration (UC11)" aria-disabled="false" opacity="1"><rect x="900" y="845" width="595" height="58" rx="9" fill="white" stroke="#aebfcd" stroke-width="2" /><text x="920" y="883" font-size="26" font-weight="600" fill="#28648b">Edit configuration (UC11)</text></g><text x="900" y="940" font-size="24" font-weight="400" fill="#20364b">Edit scene, action limits and budgets.</text><text x="900" y="976" font-size="24" font-weight="400" fill="#20364b">Validate, correct errors, then save a version.</text><rect x="48" y="1050" width="1504" height="155" rx="10" fill="#e7edf2" stroke="#a8b9c6" stroke-width="2" /><text x="72" y="1085" font-size="24" font-weight="700" fill="#536a7c">DEMO ONLY · illustrative events, outside product permissions and workflow</text><g class="button" role="button" tabindex="0" data-action="demo" aria-label="Example: data ready" aria-disabled="false" opacity="1"><rect x="72" y="1110" width="330" height="58" rx="9" fill="white" stroke="#aebfcd" stroke-width="2" /><text x="92" y="1148" font-size="26" font-weight="600" fill="#28648b">Example: data ready</text></g><g class="button" role="button" tabindex="0" data-action="demo" aria-label="Validation result" aria-disabled="fals