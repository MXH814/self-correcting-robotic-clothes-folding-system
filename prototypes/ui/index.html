<script>
function show(n){document.querySelectorAll('.panel').forEach((p,i)=>p.hidden=i+1!==n);document.querySelectorAll('[data-screen]').forEach(b=>b.setAttribute('aria-current',String(+b.dataset.screen===n)))}
const messages={
'Example: invalid scene':'Start rejected: the camera observation is older than one second. Refresh the camera view and check readiness. No task ID or robot motion is created.',
'Example: stop unconfirmed':'Start stays locked. The adapter must report fresh measured rest with an empty command queue before another task can start.',
'Return check fails':'Return rejected: clothing extends outside the registered table area. Autonomous dispatch stays locked. Select Take control again after confirmed rest, correct the position, then Return.',
'Adapter stop timeout':'Stop proof did not arrive within one wall second. Device state is UNCONFIRMED. A nonterminal task fails; adjustment and new tasks remain locked until fresh proof.',
'Edit configuration (UC11)':'Maintainer configuration: edit the scene profile, action bounds, stop thresholds, maximum billable interval and budgets. Validate units, ranges and adapter compatibility. Save a new version only while idle with confirmed rest.',
'Validate candidate':'Validation is locked until a trained candidate and valid split manifest exist. The screen does not represent a trained model.',
'Quality status examples':'Quality states are Pending, Pass, Fail or Unable to assess. Autonomous success additionally needs a valid COMPLETED outcome, no assistance or help request, and completion within budgets.',
'Train candidate':'An offline training job needs an approved cost estimate, budget and maximum resource duration. This mockup does not launch a job.',
'Delete saved record':'Request confirmation, verify ownership and active dependencies, then delete only permitted records. This gallery has no saved task database.',
'Export task record':'A permitted export contains task evidence without participant identifiers. No robot command is executed during export.',
'Advance time':'Illustrative budget example: active simulation time and GPU wall time are separate. Budget monitoring continues during pause, assistance and waiting without a new action.',
'Check readiness':'The system checks the fixed garment profile, fresh camera evidence, work area, robot state, storage and confirmed rest. Failed checks explain the correction required.',
'Take control':'Manual adjustments require a confirmed halt and explicit takeover. Autonomous authority is revoked until Return, new halt proof and validation pass.'};
document.addEventListener('click',e=>{let b=e.target.closest('[data-screen]');if(b){show(+b.dataset.screen);return}b=e.target.closest('g.button');if(!b||b.getAttribute('aria-disabled')==='true')return;let label=b.getAttribute('aria-label')||'';if(b.dataset.action==='nav'){show(+label.slice(0,1));return}document.querySelector('#dtitle').textContent=label;document.querySelector('#dbody').textContent=messages[label]||'This is an illustrative requirements control. Real execution, permissions, recorded results and acceptance tests belong to the later implementation. Demo events never grant product authority.';document.querySelector('#detail').showModal()});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('g.button')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});document.querySelector('#close').onclick=()=>document.querySelector('#detail').close();
</script></html>
