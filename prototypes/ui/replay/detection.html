<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>观测分数与恢复记录 · 只读回放</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#203334;background:#f5f5ef;font:16px/1.55 system-ui,sans-serif}main{max-width:1070px;margin:auto;padding:24px}header{border-bottom:1px solid #ccc;padding-bottom:12px}h1{font-size:28px;margin:8px 0}h2{font-size:19px}a{color:#205957}button,select{font:inherit;padding:6px 10px}button{cursor:pointer}button:disabled{cursor:default}section{background:white;padding:16px;border:1px solid #d5d9d3;border-radius:6px}.columns{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;margin-top:16px}#picture{width:100%;aspect-ratio:4/3;background:#222}#curve{width:100%;height:auto}#seek{width:100%}dl{display:grid;grid-template-columns:8em minmax(0,1fr);gap:8px;margin:0}dt{color:#536461}dd{margin:0;overflow-wrap:anywhere}#message{color:#724522}small{color:#485b58}button,select{max-width:100%}p{margin:.6em 0}canvas{display:block}@media(max-width:720px){.columns{grid-template-columns:1fr}main{padding:12px}}
</style><main><p><a href="../../../docs/research/zhangmingbo/pre-abc-evidence-20261109/Z3/index.html">最新 A/B/C 实跑回放（PR29）</a></p><header><a href="index.html">返回折叠记录</a><h1>观测分数与恢复记录</h1><p>只读回放 · 图像来自仿真记录。播放和暂停只改变浏览位置。</p>
<label>选择试次 <select id="trial"></select></label></header>
<div class="columns"><section><canvas id="picture" width="320" height="240" aria-label="当前记录的相机画面"></canvas>
<p id="position"></p><input id="seek" type="range" min="0" value="0" aria-label="按记录定位"><button id="prev">上一帧</button> <button id="play">播放回放</button> <button id="next">下一帧</button>
<p><small>按每秒 8 帧浏览。时间读数来自原始记录。</small></p>
<label>跳到记录阶段 <select id="jump"></select></label>
</section><section><h2>当前画面与过去窗口</h2><dl><dt>来源</dt><dd id="source"></dd><dt>采集阶段</dt><dd id="phase"></dd><dt>检测方法</dt><dd id="method"></dd><dt>逐帧 / 窗口分数</dt><dd id="score"></dd><dt>阈值 / 判定</dt><dd id="decision"></dd></dl><canvas id="curve" width="470" height="96" aria-label="截至当前帧的离线窗口分数"></canvas><small id="legend"></small>
<h2>恢复及结局</h2><p id="events"></p><p id="outcome"></p><details><summary>导入同试次检测／恢复日志</summary><p><label>组员导出的 JSONL <input id="journal" type="file" accept=".jsonl,.ndjson" multiple></label></p><small>按试次和观测编号对齐。缺观测编号的事件只列顺序。导入日志与离线重算分别显示。</small><pre id="journalRows" style="white-space:pre-wrap"></pre></details><details><summary>源记录身份</summary><small id="identity"></small></details></section></div><p id="message" role="status"></p></main>
<script src="detection-data/trials.js"></script><script src="detection.js"></script></html>
