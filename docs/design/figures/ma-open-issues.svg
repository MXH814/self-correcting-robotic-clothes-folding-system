<text x="64" y="373" font-size="23" font-weight="normal" fill="#20344b" text-anchor="start">Cancellation and stop</text>
<text x="64" y="424" font-size="20" font-weight="normal" fill="#526b83" text-anchor="start">Zhang + Ma</text>
<text x="306" y="373" font-size="23" font-weight="normal" fill="#20344b" text-anchor="start">Delay an old command until after halt.</text>
<text x="306" y="405" font-size="23" font-weight="normal" fill="#20344b" text-anchor="start">Verify fencing and measured rest.</text>
<text x="848" y="373" font-size="22" font-weight="normal" fill="#20344b" text-anchor="start">Keep the stop lock until evidence</text>
<text x="848" y="405" font-size="22" font-weight="normal" fill="#20344b" text-anchor="start">passes the SRS conditions.</text>
