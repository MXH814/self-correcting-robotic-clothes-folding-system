<text x="64" y="241" font-size="23" font-weight="normal" fill="#20344b" text-anchor="start">Input semantics</text>
<text x="64" y="292" font-size="20" font-weight="normal" fill="#526b83" text-anchor="start">Zhang + Ma</text>
<text x="306" y="241" font-size="23" font-weight="normal" fill="#20344b" text-anchor="start">Capture runtime joint maps, units, clocks</text>
<text x="306" y="273" font-size="23" font-weight="normal" fill="#20344b" text-anchor="start">and actual command feedback.</text>
<text x="848" y="241" font-size="22" font-weight="normal" fill="#20344b" text-anchor="start">Reject unsupported online profiles.</text>
<text x="848" y="273" font-size="22" font-weight="normal" fill="#20344b" text-anchor="start">Keep old data for offline work.</text>
