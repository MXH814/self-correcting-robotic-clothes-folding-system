<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#31628a"/></marker></defs><rect width="1280" height="720" fill="white"/><g font-family="Times New Roman,serif"><text x="48" y="60" font-size="37" font-weight="bold" fill="#20344b" text-anchor="start">Open issues and verification</text>
<text x="48" y="105" font-size="24" font-weight="normal" fill="#20344b" text-anchor="start">Current evidence covers 153 normal frames. Recovery experiments remain pending.</text>
