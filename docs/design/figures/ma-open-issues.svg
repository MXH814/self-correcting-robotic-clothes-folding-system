<text x="306" y="505" font-size="23" font-weight="normal" fill="#20344b" text-anchor="start">Collect comparable recovery branches.</text>
<text x="306" y="537" font-size="23" font-weight="normal" fill="#20344b" text-anchor="start">Test H1 / H2, baselines and calibration.</text>
<text x="848" y="505" font-size="22" font-weight="normal" fill="#20344b" text-anchor="start">Use offline ranking while evidence</text>
<text x="848" y="537" font-size="22" font-weight="normal" fill="#20344b" text-anchor="start">or probability calibration is missing.</text>
<text x="48" y="642" font-size="22" font-weight="normal" fill="#20344b" text-anchor="start">Each PoC records raw evidence, pass/fail criteria, a responsible member and the fallback.</text>
<text x="48" y="682" font-size="20" font-weight="normal" fill="#20344b" text-anchor="start">Status: design plan. Recovery performance and physical stopping await validation.</text></g></svg>
